<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book club</title>
    <link rel="stylesheet" href="../styles/styles.css" />
  </head>
  <body>
    <header>
      <nav>
        <ul class="navigation-links">
          <li><a href="../index.html">Home page</a></li>
          <li><a href="#reader_form">Fill out the form</a></li>
          <li><a href="../pages/tables.html">Tables</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Book club registration form</h1>
      <section id="reader_form">
        <form>
          <fieldset>
            <legend>Personal information</legend>
            <label
              >First name:<input type="text" name="first-name" required
            /></label>
            <label>Last name:<input type="text" name="last-name" /></label>
            <label
              >Age:<input type="number" name="age" min="5" max="120"
            /></label>
            <label
              >Email:<input
                type="email"
                name="email"
                placeholder="example@gmail.com"
                required
                minlength="5"
                maxlength="50"
            /></label>
            <label
              >Tel.:<input type="tel" name="phone-number" required
            /></label>
            <label>Country:<input type="text" name="country" /></label>
          </fieldset>

          <fieldset>
            <legend>Sex:</legend>
            <label><input type="radio" name="sex" value="male" />Male</label>
            <label
              ><input type="radio" name="sex" value="female" />Female</label
            >
          </fieldset>

          <fieldset>
            <legend>Choose which of this genres you are into:</legend>
            <label
              ><input type="checkbox" name="genre" value="sci-fi" />Science
              Fiction</label
            >
            <label
              ><input
                type="checkbox"
                name="genre"
                value="fantasy"
              />Fantasy</label
            >
            <label
              ><input
                type="checkbox"
                name="genre"
                value="mystery"
              />Mystery</label
            >
            <label
              ><input
                type="checkbox"
                name="genre"
                value="detective"
              />Detective</label
            >
            <label
              ><input
                type="checkbox"
                name="genre"
                value="thriller"
              />Thriller</label
            >
            <label
              ><input
                type="checkbox"
                name="genre"
                value="horror"
              />Horror</label
            >
            <label
              ><input
                type="checkbox"
                name="genre"
                value="romance"
              />Romance</label
            >
            <label
              ><input
                type="checkbox"
                name="genre"
                value="history"
              />History/Biography and Memoir</label
            >
            <label
              ><input type="checkbox" name="genre" value="true-crime" />True
              Crime</label
            >
            <label
              ><input
                type="checkbox"
                name="genre"
                value="psychology"
              />Self-Help/Psychology</label
            >
            <label
              ><input type="checkbox" name="genre" value="other" />Other</label
            >
          </fieldset>

          <fieldset>
            <legend>Which format do you prefer?</legend>
            <label for="book-format">Choose favourite format:</label>
            <select name="book-format" id="book-format">
              <option value="paper">Paperbook</option>
              <option value="ebook">E-book</option>
              <option value="audio">Audiobook</option>
            </select>
          </fieldset>

          <fieldset>
            <legend>Choose your reading pace (daily)</legend>
            <label
              ><input type="radio" name="pages-day" value="1-20" />1-20
              pages</label
            >
            <label
              ><input type="radio" name="pages-day" value="20-40" />20-40
              pages</label
            >
            <label
              ><input type="radio" name="pages-day" value="40+" />40+
              pages</label
            >
          </fieldset>

          <label class="favcover"
            >Share your favourite cover with us<input
              class="favcover-file"
              type="file"
              name="favcover"
          /></label>

          <label
            >Why do you choose our book club? What do you expect?
            <textarea
              name="expectations"
              cols="20"
              rows="5"
              placeholder="Enter your thoughts..."
            ></textarea>
          </label>

          <label
            >Create your password:<input
              type="password"
              name="password"
              minlength="8"
              required
          /></label>

          <button class="submit" type="submit">Submit</button>
          <button class="reset" type="reset">Reset</button>
        </form>
      </section>
    </main>
    <footer>
      <address>
        <a href="mailto:mkrivokhina@gmail.com">mkrivokhina@gmail.com</a>
        <a href="tel:+38066*******">+38066*******</a>
        <p>Kyiv, Ukraine</p>
      </address>
    </footer>
  </body>
</html>
